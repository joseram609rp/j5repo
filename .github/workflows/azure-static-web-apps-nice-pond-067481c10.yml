
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - prod
      - dev

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - prod

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_POND_067481C10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          production_branch: "prod"

          # Application paths
          app_location: "./frontend"
          api_location: "./backend"
          output_location: "dist"

          # Install dependencies using the workspace lockfile
          app_build_command: "cd .. && npx --yes pnpm@11.19.0 install --frozen-lockfile && npx --yes pnpm@11.19.0 --filter @j5/frontend build"
          api_build_command: "cd .. && npx --yes pnpm@11.19.0 install --frozen-lockfile && npx --yes pnpm@11.19.0 --filter @j5/backend build"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_POND_067481C10 }}
          action: "close"
